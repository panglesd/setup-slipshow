on:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  ubuntu_test:
    name: Testing latest on ubuntu
    runs-on: ubuntu-latest

    steps:
      # To use this repository's private action,
      # you must check out the repository
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install slipshow
        uses: ./ # Uses an action in the root directory

      - name: Check version
        run: slipshow --version

      - name: Compile example into _site
        run: mkdir _site && slipshow compile example/example.slp -o _site/example.html

      - name: Upload as artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: ubuntu_test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  ubuntu_fixed:
    name: Testing fixed version on ubuntu
    runs-on: ubuntu-latest

    steps:
      # To use this repository's private action,
      # you must check out the repository
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install slipshow
        uses: ./ # Uses an action in the root directory
        with:
          version: v0.11.0

      # Use the output from the `hello` step
      - name: Check version
        run: slipshow --version

